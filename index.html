<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Battle Hub - Play Games</title>
    <style>
        body {
            background-color: #0d1117;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            padding-bottom: 70px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            background: #161b22;
            border-bottom: 1px solid #30363d;
        }
        .app-title {
            font-weight: bold;
            font-size: 20px;
            color: #ff4500;
        }
        .stats-box {
            display: flex;
            gap: 10px;
        }
        .balance, .level-badge {
            background: #21262d;
            padding: 5px 10px;
            border-radius: 20px;
            color: #ffd700;
            font-size: 13px;
            font-weight: bold;
            border: 1px solid #30363d;
        }
        /* Level Progress Section */
        .progress-container {
            background: #161b22;
            margin: 15px;
            padding: 15px;
            border-radius: 12px;
            border: 1px solid #30363d;
        }
        .progress-header {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 8px;
            color: #ffcc00;
        }
        .progress-bar-bg {
            background: #30363d;
            border-radius: 10px;
            height: 10px;
            width: 100%;
            overflow: hidden;
        }
        .progress-bar-fill {
            background: #2ea043;
            height: 100%;
            width: 15%; /* Level 1 progress */
        }
        .section-title {
            padding: 10px 15px;
            font-size: 16px;
            font-weight: bold;
            color: #ffcc00;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .game-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            padding: 0 15px 15px 15px;
        }
        .game-card {
            background: #21262d;
            border-radius: 12px;
            overflow: hidden;
            text-align: center;
            border: 1px solid #30363d;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .game-card:active {
            transform: scale(0.96);
        }
        .game-card img {
            width: 100%;
            height: 110px;
            object-fit: cover;
        }
        .game-name {
            padding: 10px;
            font-size: 13px;
            font-weight: 600;
            color: #ffffff;
        }
        /* Fullscreen Game Modal / Player */
        #gameModal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000000;
            z-index: 1000;
            flex-direction: column;
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #161b22;
            padding: 12px 15px;
            border-bottom: 1px solid #30363d;
        }
        .close-btn {
            background: #ff4500;
            color: white;
            border: none;
            padding: 6px 14px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }
        #gameFrame {
            width: 100%;
            height: calc(100% - 50px);
            border: none;
        }
        /* Bottom Navigation Bar */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            width: 100%;
            background: #161b22;
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            border-top: 1px solid #30363d;
            z-index: 999;
        }
        .nav-item {
            text-align: center;
            font-size: 11px;
            color: #8b949e;
            cursor: pointer;
        }
        .nav-item.active {
            color: #ffcc00;
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="app-title">🔥 3D Battle Hub</div>
        <div class="stats-box">
            <div class="balance">🪙 136</div>
            <div class="level-badge">⭐ Level 1</div>
        </div>
    </div>

    <div class="progress-container">
        <div class="progress-header">
            <span>प्रोग्रेस और मिस्ट्री बॉक्स (Level 1 / 15)</span>
            <span style="color: #8b949e;" title="नेक्स्ट अपडेट के बाद और भी गिफ्ट्स मिलेंगे!">❓</span>
        </div>
        <div style="font-size: 12px; color: #8b949e; margin-bottom: 8px;">अगला लेवल टारगेट: 225 एड्स</div>
        <div class="progress-bar-bg">
            <div class="progress-bar-fill"></div>
        </div>
    </div>

    <div class="section-title">
        ⚡ 3D ओरिजिनल गेम्स (1ms स्पीड)
    </div>
    <div class="game-grid">
        <div class="game-card" onclick="launchGame('Battle Royale', 'https://gamedistribution.com/games/battle-royale')">
            <img src="https://images.unsplash.com/photo-1542751371-adc38448a05e?w=300&auto=format&fit=crop" alt="Battle Royale">
            <div class="game-name">Battle Royale</div>
        </div>
        <div class="game-card" onclick="launchGame('Airdrop Clash', 'https://gamedistribution.com/games/airdrop')">
            <img src="https://images.unsplash.com/photo-1511512578047-dfb367046420?w=300&auto=format&fit=crop" alt="Airdrop Clash">
            <div class="game-name">Airdrop Clash</div>
        </div>
        <div class="game-card" onclick="launchGame('Sniper Arena', 'https://gamedistribution.com/games/sniper')">
            <img src="https://images.unsplash.com/photo-1550745165-9bc0b252726f?w=300&auto=format&fit=crop" alt="Sniper Arena">
            <div class="game-name">Sniper Arena</div>
        </div>
        <div class="game-card" onclick="launchGame('Speed Racing', 'https://gamedistribution.com/games/racing')">
            <img src="https://images.unsplash.com/photo-1511919884226-fd3cad34687c?w=300&auto=format&fit=crop" alt="Speed Racing">
            <div class="game-name">Speed Racing</div>
        </div>
    </div>

    <div id="gameModal">
        <div class="modal-header">
            <span id="modalGameTitle" style="font-weight: bold; color: #ffcc00;">Game Playing</span>
            <button class="close-btn" onclick="closeGame()">বন্ধ करें / Close</button>
        </div>
        <iframe id="gameFrame" src=""></iframe>
    </div>

    <div class="bottom-nav">
        <div class="nav-item active">🏠<br>लॉबी</div>
        <div class="nav-item">👥<br>फ्रेंड्स</div>
        <div class="nav-item">💳<br>वॉलेंट</div>
    </div>

    <script>
        function launchGame(gameName, gameUrl) {
            document.getElementById('modalGameTitle').innerText = gameName + " - चल रहा है...";
            document.getElementById('gameFrame').src = gameUrl;
            document.getElementById('gameModal').style.display = 'flex';
        }

        function closeGame() {
            document.getElementById('gameModal').style.display = 'none';
            document.getElementById('gameFrame').src = '';
        }
    </script>
</body>
</html>
