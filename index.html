<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Battle & Gaming Hub</title>
    <style>
        body {
            background-color: #0d1117;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            background: #161b22;
            border-bottom: 1px solid #30363d;
        }
        .balance {
            background: #21262d;
            padding: 5px 12px;
            border-radius: 20px;
            color: #ffd700;
            font-weight: bold;
        }
        .section-title {
            padding: 15px 15px 5px 15px;
            font-size: 18px;
            font-weight: bold;
            color: #ffcc00;
        }
        .game-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            padding: 15px;
        }
        .game-card {
            background: #21262d;
            border-radius: 12px;
            overflow: hidden;
            text-align: center;
            border: 1px solid #30363d;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .game-card:active {
            transform: scale(0.95);
        }
        .game-card img {
            width: 100%;
            height: 90px;
            object-fit: cover;
        }
        .game-name {
            padding: 8px;
            font-size: 12px;
            font-weight: 600;
        }
        /* Bottom Navigation Bar */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            width: 100%;
            background: #161b22;
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            border-top: 1px solid #30363d;
        }
        .nav-item {
            text-align: center;
            font-size: 11px;
            color: #8b949e;
            cursor: pointer;
        }
        .nav-item.active {
            color: #ffcc00;
        }
    </style>
</head>
<body>

    <!-- Header Section -->
    <div class="header">
        <div style="font-weight: bold; font-size: 20px; color: #ff4500;">GameHub</div>
        <div class="balance">🪙 100.53</div>
    </div>

    <!-- Originals Section -->
    <div class="section-title">Originals - 99% RTP</div>
    <div class="game-grid">
        <div class="game-card" onclick="playGame('Mines')">
            <img src="https://via.placeholder.com/100x90/ff4500/fff?text=Mines" alt="Mines">
            <div class="game-name">Mines</div>
        </div>
        <div class="game-card" onclick="playGame('Chicken')">
            <img src="https://via.placeholder.com/100x90/ffcc00/fff?text=Chicken" alt="Chicken">
            <div class="game-name">Chicken</div>
        </div>
        <div class="game-card" onclick="playGame('Aviator')">
            <img src="https://via.placeholder.com/100x90/e63946/fff?text=Aviator" alt="Aviator">
            <div class="game-name">Aviator</div>
        </div>
    </div>

    <!-- Casino / Slots Section -->
    <div class="section-title">Slots & Casino</div>
    <div class="game-grid">
        <div class="game-card" onclick="playGame('Fortune Gems')">
            <img src="https://via.placeholder.com/100x90/1d3557/fff?text=Fortune" alt="Fortune">
            <div class="game-name">Fortune Gems</div>
        </div>
        <div class="game-card" onclick="playGame('Ludo')">
            <img src="https://via.placeholder.com/100x90/457b9d/fff?text=Ludo" alt="Ludo">
            <div class="game-name">Ludo King</div>
        </div>
        <div class="nav-card game-card" onclick="playGame('Boxing King')">
            <img src="https://via.placeholder.com/100x90/2a9d8f/fff?text=Boxing" alt="Boxing">
            <div class="game-name">Boxing King</div>
        </div>
    </div>

    <!-- Bottom Navigation -->
    <div class="bottom-nav">
        <div class="nav-item active" onclick="switchTab('Home')">🏠<br>Home</div>
        <div class="nav-item" onclick="switchTab('VIP')">👑<br>VIP</div>
        <div class="nav-item" onclick="switchTab('Earn')">💰<br>Earn</div>
        <div class="nav-item" onclick="switchTab('Promos')">🎁<br>Promos</div>
    </div>

    <script>
        function playGame(gameName) {
            alert(gameName + " गेम लोड हो रहा है! यहाँ असली गेम या कार्टून वीडियो प्ले होगा।");
        }
        function switchTab(tabName) {
            alert(tabName + " सेक्शन ओपन हो रहा है।");
        }
    </script>
</body>
</html>
